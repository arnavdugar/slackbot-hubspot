openapi: 3.0.3
info:
  title: Slack HubSpot bridge
  version: 1.0.0
paths:
  /livez:
    get:
      operationId: live
      responses:
        '200':
          description: Process is alive
  /metrics:
    get:
      operationId: metrics
      responses:
        '200':
          description: Prometheus metrics; the exporter negotiates the exposition format using Accept.
          content:
            application/openmetrics-text:
              schema:
                type: string
            application/vnd.google.protobuf:
              schema:
                format: binary
                type: string
            text/plain:
              schema:
                type: string
        '500':
          description: Metrics collection failed
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Metrics storage unavailable
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          description: Selected storage and schema are ready
        '503':
          description: Not ready or shutting down
  /slack/events:
    post:
      operationId: slackEvent
      description: Authenticated Slack Events API envelopes. Raw-body signature verification precedes JSON decoding.
      parameters:
        - in: header
          name: X-Slack-Request-Timestamp
          required: true
          schema:
            type: string
      security:
        - SlackSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Envelope'
      responses:
        '200':
          description: Durably accepted, deliberately ignored, or URL challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        '400':
          description: Malformed envelope
        '401':
          description: Invalid signature, timestamp, or workspace
        '413':
          description: Payload too large
        '415':
          description: Content type must be application/json
        '503':
          description: Temporary failure; Slack should retry
components:
  securitySchemes:
    SlackSignature:
      description: Slack v0 HMAC SHA-256 signature over version, timestamp, and exact raw request body; timestamps must be within five minutes.
      in: header
      name: X-Slack-Signature
      type: apiKey
  schemas:
    Acknowledgement:
      type: object
      properties:
        challenge:
          type: string
    Envelope:
      type: object
      required: [type]
      properties:
        challenge:
          type: string
        event:
          $ref: '#/components/schemas/SlackEvent'
        event_id:
          type: string
        team_id:
          type: string
        type:
          type: string
    SlackEvent:
      type: object
      required: [type]
      properties:
        bot_id:
          type: string
        channel:
          type: string
        channel_type:
          type: string
        deleted_ts:
          type: string
        message:
          $ref: '#/components/schemas/SlackMessage'
        previous_message:
          $ref: '#/components/schemas/SlackMessage'
        subtype:
          type: string
        text:
          type: string
        thread_ts:
          type: string
        ts:
          type: string
        type:
          type: string
        user:
          type: string
    SlackMessage:
      type: object
      properties:
        bot_id:
          type: string
        subtype:
          type: string
        text:
          type: string
        thread_ts:
          type: string
        ts:
          type: string
        user:
          type: string
